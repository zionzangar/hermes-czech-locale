"settings.appearance.fileBrowserDesc": "Když je otevřen pracovní prostor, zobrazí prohlížeč souborů vedle chatu. Totéž mění i přepínač v titulním pruhu."
"settings.appearance.fileBrowserTitle": "Prohlížeč souborů"
"settings.appearance.modelPricingDesc": "Ve výběru modelu zobrazí cenu vstupu, výstupu a čtení z cache za milion tokenů."
"settings.appearance.modelPricingTitle": "Ceny modelů"
"settings.config.keepAwakeAlways": "Vždy"
"settings.config.keepAwakeOff": "Vypnuto"
"settings.config.keepAwakeWhileWorking": "Při práci"
"settings.fieldDescriptions.agent.imageInputMode": "Určuje, jak se obrázkové přílohy posílají modelu."
"settings.fieldDescriptions.agent.maxTurns": "Maximální počet tahů s voláním nástrojů, než Hermes běh zastaví."
"settings.fieldDescriptions.approvals.mode": "Určuje, jak Hermes zpracovává příkazy vyžadující výslovné schválení."
"settings.fieldDescriptions.approvals.timeout": "Jak dlouho výzvy ke schválení čekají, než vyprší časový limit."
"settings.fieldDescriptions.auxiliary.compression.timeout": "Počet sekund čekání na pomocný kompresní model při jednom volání (výchozí 120). U pomalých místních modelů hodnotu zvyšte."
"settings.fieldDescriptions.browser.useRealProfile": "Místní prohlížení používá vaše skutečná přihlášení. Hermes zkopíruje profil výchozího prohlížeče do spravovaného snímku a ovládá jej přes zabalený Chromium; živý profil nikdy neotevírá přímo. Podporovány jsou prohlížeče založené na Chromiu."
"settings.fieldDescriptions.checkpoints.enabled": "Před úpravami souborů vytváří snímky pro návrat změn."
"settings.fieldDescriptions.codeExecution.mode": "Určuje, jak přísně je spouštění kódu omezeno na aktuální projekt."
"settings.fieldDescriptions.compression.codexGpt55Autoraise": "U podporovaných modelů ChatGPT Codex OAuth zvýší práh komprese na 85 %."
"settings.fieldDescriptions.compression.enabled": "Při zvětšení konverzace shrnuje starší kontext."
"settings.fieldDescriptions.context.engine": "Strategie správy dlouhých konverzací blízko limitu kontextu."
"settings.fieldDescriptions.desktop.repoScanEnabled": "Prohledává místní složky a zobrazuje Git repozitáře v Projektech."
"settings.fieldDescriptions.desktop.repoScanExcludePaths": "Složky a jejich podadresáře, které se při hledání repozitářů přeskočí."
"settings.fieldDescriptions.desktop.repoScanRoots": "Složky k prohledání. Prázdná hodnota znamená domovskou složku."
"settings.fieldDescriptions.display.personality": "Výchozí styl asistenta pro nové relace."
"settings.fieldDescriptions.display.showReasoning": "Zobrazuje části s uvažováním, pokud je backend poskytne."
"settings.fieldDescriptions.fallbackProviders": "Záložní položky poskytovatel:model, které se použijí při selhání výchozího modelu."
"settings.fieldDescriptions.fileReadMaxChars": "Maximální počet znaků, které může Hermes přečíst v jednom požadavku na soubor."
"settings.fieldDescriptions.memory.memoryEnabled": "Ukládá trvalé vzpomínky, které mohou pomoci v budoucích relacích."
"settings.fieldDescriptions.memory.userProfileEnabled": "Udržuje stručný profil uživatelských preferencí."
"settings.fieldDescriptions.model": "Používá se pro nové chaty, pokud v editoru nevyberete jiný model."
"settings.fieldDescriptions.modelContextLength": "Přepíše zjištěnou délku kontextu pouze pro hlavní model chatu (v tokenech). Hodnota 0 použije zjištěnou hodnotu vybraného modelu."
"settings.fieldDescriptions.security.redactSecrets": "Kdykoli je to možné, skryje rozpoznaná tajemství před obsahem viditelným pro model."
"settings.fieldDescriptions.stt.echoTranscripts": "Vrací nezpracovaný přepis hlasových zpráv 🎙️ zpět do chatu."
"settings.fieldDescriptions.stt.elevenlabs.languageCode": "Volitelný kód jazyka ISO-639-3. Prázdná hodnota nechá ElevenLabs jazyk rozpoznat automaticky."
"settings.fieldDescriptions.stt.enabled": "Zapne místní nebo poskytovatelem zajištěný převod řeči na text."
"settings.fieldDescriptions.stt.streaming": "Zobrazuje text během mluvení (OpenAI, xAI, ElevenLabs). Při chybě se vrátí k nahrávce."
"settings.fieldDescriptions.terminal.cwd": "Výchozí složka projektu pro nástroje a práci v terminálu."
"settings.fieldDescriptions.terminal.daytonaImage": "Obraz používaný při backendu Daytona."
"settings.fieldDescriptions.terminal.dockerImage": "Obraz kontejneru používaný při backendu Docker."
"settings.fieldDescriptions.terminal.envPassthrough": "Proměnné prostředí předávané do spouštěných nástrojů."
"settings.fieldDescriptions.terminal.modalImage": "Obraz používaný při backendu Modal."
"settings.fieldDescriptions.terminal.persistentShell": "Backend SSH: zachová exportované proměnné mezi příkazy. Při vypnutí každý příkaz začíná z přihlašovacího prostředí; pracovní adresář se zachovává vždy."
"settings.fieldDescriptions.terminal.singularityImage": "Obraz používaný při backendu Singularity."
"settings.fieldDescriptions.timezone": "Identifikátor časového pásma IANA. Prázdná hodnota použije systémové časové pásmo."
"settings.fieldDescriptions.tts.neutts.device": "Zařízení pro místní inferenci NeuTTS."
"settings.fieldDescriptions.tts.xai.autoSpeechTags": "Nechá LLM před syntézou vložit do textu expresivní zvukové značky ([laughing], [sighs])."
"settings.fieldDescriptions.tts.xai.bitRate": "Datový tok MP3 v b/s. Platí pouze pro kodek mp3."
"settings.fieldDescriptions.tts.xai.language": "Kód mluveného jazyka (např. en, pt-BR) nebo „auto“ pro automatické rozpoznání."
"settings.fieldDescriptions.tts.xai.optimizeStreamingLatency": "Kompromis mezi latencí a kvalitou. 0 = nejlepší kvalita, 2 = nejnižší latence."
"settings.fieldDescriptions.tts.xai.sampleRate": "Vzorkovací frekvence zvuku v Hz. Vyšší znamená lepší kvalitu a větší soubory."
"settings.fieldDescriptions.tts.xai.speed": "Rychlost přehrávání. 0,7 = pomaleji, 1,0 = normálně, 1,5 = rychleji."
"settings.fieldDescriptions.tts.xai.voiceId": "ID hlasu xAI (např. eve) nebo vlastní ID hlasu."
"settings.fieldDescriptions.updates.nonInteractiveLocalChanges": "Při aktualizaci Hermesu z aplikace bez terminálové výzvy určuje, zda se místní změny zdrojů zachovají (stash), nebo zahodí (discard). Aktualizace z terminálu se vždy zeptají."
"settings.fieldDescriptions.voice.autoTts": "Automaticky nahlas přečte odpovědi asistenta."
"settings.fieldDescriptions.voice.gptLive.instructions": "Další věty pro osobnost živého hlasu (tón, tempo, jazyk). Hermes si zachovává vlastní systémový prompt."
"settings.fieldDescriptions.voice.gptLive.voice": "Hlas pro režim GPT-Live. Lze použít i vlastní ID hlasu."
"settings.fieldDescriptions.voice.voiceChatMode": "chained: převod řeči na text → Hermes → převod textu na řeč. gpt-live: jeden plně duplexní hlasový model OpenAI poslouchá a mluví a skutečné požadavky předává Hermesu."
