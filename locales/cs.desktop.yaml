"settings.gateway.intro": "Výchozí je místní připojení. Vzdálené připojení použijte, pokud má tato aplikace ovládat backend Hermes na jiném zařízení. Připojení k branám platí pro celý počítač; profily se načítají z připojených bran."
"settings.gateway.keychainEncryptionDesc": "Ve výchozím nastavení je vypnuto. Po zapnutí jsou tokeny bran a přihlašovací údaje šifrovány systémovou klíčenkou (Keychain Access, GNOME Keyring nebo Windows DPAPI). Systém může vyžádat oprávnění nebo heslo. Při vypnutí jsou údaje uloženy jako běžné soubory čitelné pouze vaším uživatelským účtem."
