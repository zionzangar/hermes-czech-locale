name: Build KIT Scenarist CZ VN Safe Fix 5

on:
  push:
    branches: [kit-scenarist-cz-build]
    paths:
      - ".github/workflows/kit-scenarist-cz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build input branch
        uses: actions/checkout@v4
        with:
          ref: kit-scenarist-cz-build
          path: inputs

      - name: Checkout KIT Scenarist
        uses: actions/checkout@v4
        with:
          repository: dimkanovikov/KITScenarist
          ref: develop
          submodules: recursive
          path: upstream

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 5.14.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.14.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2017_64"
          modules: "qtwebengine"
          cache: true

      - name: Prepare Czech translation and spellchecker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\inputs\kit-build\jsonparts\part*.txt" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 translation parts, got $($parts.Count)" }
          $json = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\translations.json", $json, [Text.UTF8Encoding]::new($false))

          $core = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-core"
          $trans = "$core\Resources\Translations"
          $py = @'
          import json, html, re, pathlib, xml.etree.ElementTree as ET, os
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          trans_dir = workspace / "upstream" / "src" / "bin" / "scenarist-core" / "Resources" / "Translations"
          en_path = trans_dir / "Scenarist_en.ts"
          cs_path = trans_dir / "Scenarist_cs.ts"
          translations = json.loads((workspace / "translations.json").read_text(encoding="utf-8"))
          tree = ET.parse(en_path)
          root = tree.getroot()
          root.set("language", "cs_CZ")
          seen = {}
          messages = 0
          for msg in root.findall(".//message"):
              src_el = msg.find("source")
              if src_el is None:
                  continue
              src = src_el.text or ""
              if src not in seen:
                  seen[src] = len(seen)
              idx = seen[src]
              value = html.unescape(translations[str(idx)])
              if sorted(re.findall(r"%\d+", src)) != sorted(re.findall(r"%\d+", value)):
                  raise RuntimeError(f"Placeholder mismatch at {idx}: {src!r}")
              tr = msg.find("translation")
              if tr is None:
                  tr = ET.SubElement(msg, "translation")
              tr.attrib.pop("type", None)
              tr.text = value
              messages += 1
          if messages != 1202 or len(seen) != 1016 or len(translations) != 1016:
              raise RuntimeError(f"Unexpected translation structure: messages={messages}, unique={len(seen)}, translations={len(translations)}")

          vn_names = {
              "Scene Heading": "N\u00e1zev sc\u00e9ny",
              "Scene Characters": "Skok na sc\u00e9nu",
              "Action": "D\u011bn\u00ed",
              "Character": "Postava",
              "Parenthetical": "Tech. popis",
              "Dialog": "Dialog",
              "Transition": "SFX / Zvuk",
              "Shot": "Obraz",
              "Noprintable Text": "Intern\u00ed logika",
              "Folder": "Kapitola",
              "Scene Description": "Popis sc\u00e9ny",
              "Lyrics": "Hern\u00ed volba",
          }
          for context in root.findall("context"):
              if (context.findtext("name") or "") != "BusinessLogic::ScenarioBlockStyle":
                  continue
              for msg in context.findall("message"):
                  src = msg.findtext("source") or ""
                  if src in vn_names:
                      tr = msg.find("translation")
                      if tr is None:
                          tr = ET.SubElement(msg, "translation")
                      tr.attrib.pop("type", None)
                      tr.text = vn_names[src]

          tmp = cs_path.with_suffix(".tmp")
          tree.write(tmp, encoding="utf-8", xml_declaration=True)
          text = tmp.read_text(encoding="utf-8")
          first, rest = text.split("\n", 1)
          cs_path.write_text(first + "\n<!DOCTYPE TS>\n" + rest, encoding="utf-8")
          tmp.unlink()
          '@
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\make_czech_ts.py", $py, [Text.UTF8Encoding]::new($false))
          python "$env:GITHUB_WORKSPACE\make_czech_ts.py"

          lrelease "$trans\Scenarist_cs.ts" -qm "$trans\Scenarist_cs.qm"
          if (!(Test-Path "$trans\Scenarist_cs.qm")) { throw "Scenarist_cs.qm was not created" }

          $qmake = (Get-Command qmake).Source
          $qtRoot = Split-Path (Split-Path $qmake -Parent) -Parent
          $qtTranslations = Join-Path $qtRoot "translations"
          Copy-Item (Join-Path $qtTranslations "qt_cs.qm") "$trans\qt_cs.qm" -Force
          Copy-Item (Join-Path $qtTranslations "qtbase_cs.qm") "$trans\qtbase_cs.qm" -Force

          $qrcPath = "$core\Resources\Translations.qrc"
          $qrc = Get-Content -Raw -Encoding UTF8 $qrcPath
          $insert = @"
                  <file>Translations/Scenarist_cs.qm</file>
                  <file>Translations/qt_cs.qm</file>
                  <file>Translations/qtbase_cs.qm</file>
          "@
          $qrc = $qrc -replace '</qresource>', ($insert + [Environment]::NewLine + '    </qresource>')
          [IO.File]::WriteAllText($qrcPath, $qrc, [Text.UTF8Encoding]::new($false))

          $appPath = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\Application.cpp"
          $app = Get-Content -Raw -Encoding UTF8 $appPath
          $forceCzech = @"

              translationSuffix = "cs";
              qtTranslationSuffix = "cs";
              qtBaseTranslationSuffix = "cs";
              currentLanguage = QLocale::Czech;

          "@
          $needle = '    QLocale::setDefault(QLocale(currentLanguage));'
          if (!$app.Contains($needle)) { throw "Could not find locale patch point" }
          $app = $app.Replace($needle, $forceCzech + $needle)
          $app = $app.Replace('setApplicationVersion("0.7.2 rc 15");', 'setApplicationVersion("0.7.2 rc 15 CZ");')
          [IO.File]::WriteAllText($appPath, $app, [Text.UTF8Encoding]::new($false))

          $desktopPro = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop.pro"
          $pro = Get-Content -Raw -Encoding UTF8 $desktopPro
          if (!$pro.Contains('DEFINES += HUNSPELL_STATIC')) {
              $pro = $pro.Replace('CONFIG += c++11 warn_on', 'CONFIG += c++11 warn_on' + [Environment]::NewLine + 'DEFINES += HUNSPELL_STATIC')
          }
          [IO.File]::WriteAllText($desktopPro, $pro, [Text.UTF8Encoding]::new($false))

          $spellH = "$core\3rd_party\Widgets\SpellCheckTextEdit\SpellChecker.h"
          $h = Get-Content -Raw -Encoding UTF8 $spellH
          $needleH = "        Danish" + [Environment]::NewLine + "    };"
          $replaceH = "        Danish," + [Environment]::NewLine + "        Czech" + [Environment]::NewLine + "    };"
          if (!$h.Contains($needleH)) { throw "SpellChecker enum patch point not found" }
          $h = $h.Replace($needleH, $replaceH)
          [IO.File]::WriteAllText($spellH, $h, [Text.UTF8Encoding]::new($false))

          $spellCpp = "$core\3rd_party\Widgets\SpellCheckTextEdit\SpellChecker.cpp"
          $c = Get-Content -Raw -Encoding UTF8 $spellCpp
          $danish = @'
                  case Danish:
                      code = "da_DA";
                      break;
          '@
          $danishCz = @'
                  case Danish:
                      code = "da_DA";
                      break;
                  case Czech:
                      code = "cs_CZ";
                      break;
          '@
          if (!$c.Contains($danish)) { throw "Danish mapping patch point not found" }
          $c = $c.Replace($danish, $danishCz)

          $oldPath = @'
              QString appDataFolderPath = QStandardPaths::writableLocation(QStandardPaths::DataLocation);
              QString hunspellDictionariesFolderPath = appDataFolderPath + QDir::separator() + "Hunspell";
              QString dictionaryFilePath = hunspellDictionariesFolderPath + QDir::separator() + fileName;
              return dictionaryFilePath;
          '@
          $newPath = @'
              QString portableFolderPath = QApplication::applicationDirPath()
                      + QDir::separator() + "Hunspell";
              QString portableDictionaryFilePath = portableFolderPath
                      + QDir::separator() + fileName;
              if (QFileInfo::exists(portableDictionaryFilePath)) {
                  return portableDictionaryFilePath;
              }

              QString appDataFolderPath = QStandardPaths::writableLocation(QStandardPaths::DataLocation);
              QString hunspellDictionariesFolderPath = appDataFolderPath + QDir::separator() + "Hunspell";
              QString dictionaryFilePath = hunspellDictionariesFolderPath + QDir::separator() + fileName;
              return dictionaryFilePath;
          '@
          if (!$c.Contains($oldPath)) { throw "Hunspell path patch point not found" }
          $c = $c.Replace($oldPath, $newPath)
          [IO.File]::WriteAllText($spellCpp, $c, [Text.UTF8Encoding]::new($false))

          $settings = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\UserInterfaceLayer\Settings\SettingsView.cpp"
          $s = Get-Content -Raw -Encoding UTF8 $settings
          $cat = '    m_ui->spellCheckingLanguage->addItem(tr("Catalan"), SpellChecker::Catalan);'
          if (!$s.Contains($cat)) { throw "Settings spell-language patch point not found" }
          $s = $s.Replace($cat, $cat + [Environment]::NewLine + '    m_ui->spellCheckingLanguage->addItem(QStringLiteral("\u010Ce\u0161tina"), SpellChecker::Czech);')
          [IO.File]::WriteAllText($settings, $s, [Text.UTF8Encoding]::new($false))

          # This portable build must not try to download dictionaries from the old KIT server.
          # Point SettingsManager to the same local Hunspell folder beside Scenarist.exe.
          $settingsMgr = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\ManagementLayer\Settings\SettingsManager.cpp"
          $sm = Get-Content -Raw -Encoding UTF8 $settingsMgr
          $oldDictRoot = '    const QString appDataFolderPath = QStandardPaths::writableLocation(QStandardPaths::DataLocation);' + [Environment]::NewLine + '    const QString hunspellDictionariesFolderPath =' + [Environment]::NewLine + '        appDataFolderPath + QDir::separator() + "Hunspell" + QDir::separator();'
          $newDictRoot = '    const QString hunspellDictionariesFolderPath =' + [Environment]::NewLine + '        QApplication::applicationDirPath() + QDir::separator() + "Hunspell" + QDir::separator();'
          if (!$sm.Contains($oldDictRoot)) { throw "SettingsManager dictionary path patch point not found" }
          $sm = $sm.Replace($oldDictRoot, $newDictRoot)
          [IO.File]::WriteAllText($settingsMgr, $sm, [Text.UTF8Encoding]::new($false))

          $highlighter = "$core\3rd_party\Widgets\SpellCheckTextEdit\SpellCheckHighlighter.cpp"
          $hl = (Get-Content -Raw -Encoding UTF8 $highlighter).Replace("`r`n", "`n")
          $oldActiveWordBlock = "                    if (m_edited`n                            && positionInText <= m_cursorPosition`n                            && positionInText + wordToCheck.length() > m_cursorPosition) {`n                        continue;`n                    }`n"
          if (!$hl.Contains($oldActiveWordBlock)) { throw "Highlighter patch point not found" }
          $hl = $hl.Replace($oldActiveWordBlock, "")
          [IO.File]::WriteAllText($highlighter, $hl, [Text.UTF8Encoding]::new($false))

          # Visual Novel quick-format panel: use only safe existing block types.
          $fast = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\UserInterfaceLayer\Scenario\ScenarioTextEdit\ScenarioFastFormatWidget.cpp"
          $fc = Get-Content -Raw -Encoding UTF8 $fast
          $oldFast = @'
              types << ScenarioBlockStyle::SceneHeading
                    << ScenarioBlockStyle::SceneCharacters
                    << ScenarioBlockStyle::Action
                    << ScenarioBlockStyle::Character
                    << ScenarioBlockStyle::Dialogue
                    << ScenarioBlockStyle::Parenthetical
                    << ScenarioBlockStyle::Title
                    << ScenarioBlockStyle::Note
                    << ScenarioBlockStyle::Transition
                    << ScenarioBlockStyle::NoprintableText
                    << ScenarioBlockStyle::Lyrics;
          '@
          $newFast = @'
              types << ScenarioBlockStyle::FolderHeader
                    << ScenarioBlockStyle::SceneHeading
                    << ScenarioBlockStyle::SceneDescription
                    << ScenarioBlockStyle::Action
                    << ScenarioBlockStyle::Character
                    << ScenarioBlockStyle::Dialogue
                    << ScenarioBlockStyle::Parenthetical
                    << ScenarioBlockStyle::Note
                    << ScenarioBlockStyle::Transition
                    << ScenarioBlockStyle::Lyrics
                    << ScenarioBlockStyle::SceneCharacters
                    << ScenarioBlockStyle::NoprintableText;
          '@
          if (!$fc.Contains($oldFast)) { throw "Fast-format safe patch point not found" }
          $fc = $fc.Replace($oldFast, $newFast)

          # Original widget creates only 11 buttons. VN list has 12 block types.
          # Add one more button so reinitBlockStyles() cannot index past m_buttons.
          $buttonNeedle = '    m_buttons << ::createStyleButton(this);' + [Environment]::NewLine + '    reinitBlockStyles();'
          $buttonReplacement = '    m_buttons << ::createStyleButton(this);' + [Environment]::NewLine + '    m_buttons << ::createStyleButton(this);' + [Environment]::NewLine + '    reinitBlockStyles();'
          if (!$fc.Contains($buttonNeedle)) { throw "Fast-format button-count patch point not found" }
          $fc = $fc.Replace($buttonNeedle, $buttonReplacement)

          [IO.File]::WriteAllText($fast, $fc, [Text.UTF8Encoding]::new($false))

          # VN export: print chapter headers in normal script/PDF output.
          $exporter = "$core\BusinessLayer\Export\AbstractExporter.cpp"
          $ex = (Get-Content -Raw -Encoding UTF8 $exporter).Replace("`r`n", "`n")

          # VN build: printing/PDF uses the same currently selected template as the editor.
          $patternExportStyle = 'static ScenarioTemplate exportStyle\(\) \{[\s\S]*?^    \}'
          $replacementExportStyle = "static ScenarioTemplate exportStyle() {`n        return ScenarioTemplateFacade::getTemplate();`n    }"
          $ex2 = [regex]::Replace($ex, $patternExportStyle, $replacementExportStyle, [Text.RegularExpressions.RegexOptions]::Multiline)
          if ($ex2 -eq $ex) { throw "Exporter current-template patch point not found" }
          $ex = $ex2
          $oldScriptTail = "              ScenarioBlockStyle::Transition,`n              ScenarioBlockStyle::Lyrics };`n"
          $newScriptTail = "              ScenarioBlockStyle::Transition,`n              ScenarioBlockStyle::Lyrics,`n              ScenarioBlockStyle::FolderHeader };`n"
          if (!$ex.Contains($oldScriptTail)) { throw "Exporter script-print list patch point not found" }
          $ex = $ex.Replace($oldScriptTail, $newScriptTail)

          $oldInvisibleTail = "            { ScenarioBlockStyle::NoprintableText,`n              ScenarioBlockStyle::FolderFooter,`n              ScenarioBlockStyle::FolderHeader };`n"
          $newInvisibleTail = "            { ScenarioBlockStyle::NoprintableText,`n              ScenarioBlockStyle::FolderFooter };`n"
          if (!$ex.Contains($oldInvisibleTail)) { throw "Exporter invisible-list patch point not found" }
          $ex = $ex.Replace($oldInvisibleTail, $newInvisibleTail)
          [IO.File]::WriteAllText($exporter, $ex, [Text.UTF8Encoding]::new($false))

          # Preserve custom VN prefixes/postfixes when editing templates.
          $templateDialog = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\UserInterfaceLayer\Settings\TemplateDialog.cpp"
          $td = (Get-Content -Raw -Encoding UTF8 $templateDialog).Replace("`r`n", "`n")

          $patternDecorationSave = 'if \(m_ui->framingBrackets->isChecked\(\)\) \{[\s\S]*?m_blockStyle\.setPostfix\(""\);\n        \}'
          $replacementDecorationSave = @'
                  const bool standardBracketDecoration =
                (m_blockStyle.prefix() == "(" && m_blockStyle.postfix() == ")");
                  const bool noDecoration = m_blockStyle.prefix().isEmpty() && m_blockStyle.postfix().isEmpty();
                  if (m_blockStyle.type() == ScenarioBlockStyle::SceneCharacters
                && (standardBracketDecoration || noDecoration)) {
            if (m_ui->framingBrackets->isChecked()) {
                m_blockStyle.setPrefix("(");
                m_blockStyle.setPostfix(")");
            } else {
                m_blockStyle.setPrefix("");
                m_blockStyle.setPostfix("");
            }
                  }
          '@
          $td2 = [regex]::Replace($td, $patternDecorationSave, $replacementDecorationSave)
          if ($td2 -eq $td) { throw "Template decoration-save patch point not found" }
          $td = $td2

          $patternDecorationLoad = 'm_ui->framingBrackets->setEnabled\(activatedType == ScenarioBlockStyle::SceneCharacters\);\n        m_ui->framingBrackets->setChecked\(activatedBlockStyle\.hasDecoration\(\)\);'
          $replacementDecorationLoad = @'
                  const bool standardBracketDecoration =
                activatedBlockStyle.prefix() == "(" && activatedBlockStyle.postfix() == ")";
                  const bool noDecoration = activatedBlockStyle.prefix().isEmpty() && activatedBlockStyle.postfix().isEmpty();
                  m_ui->framingBrackets->setEnabled(
                activatedType == ScenarioBlockStyle::SceneCharacters
                && (standardBracketDecoration || noDecoration));
                  m_ui->framingBrackets->setChecked(standardBracketDecoration);
          '@
          $td2 = [regex]::Replace($td, $patternDecorationLoad, $replacementDecorationLoad)
          if ($td2 -eq $td) { throw "Template decoration-load patch point not found" }
          $td = $td2
          # Add lowercase option beside the existing uppercase checkbox.
          $uiFile = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\UserInterfaceLayer\Settings\TemplateDialog.ui"
          $ui = (Get-Content -Raw -Encoding UTF8 $uiFile).Replace("`r`n", "`n")
          $uiPattern = '<item row="5" column="0">\s*<widget class="QCheckBox" name="uppercase">\s*<property name="text">\s*<string>Uppercase</string>\s*</property>\s*</widget>\s*</item>'
          $uiReplacement = @'
          <item row="5" column="0">
           <widget class="QCheckBox" name="uppercase">
            <property name="text">
             <string>Uppercase</string>
            </property>
           </widget>
          </item>
          <item row="5" column="1">
           <widget class="QCheckBox" name="lowercase">
            <property name="text">
             <string>Lowercase</string>
            </property>
           </widget>
          </item>
          '@
          $ui2 = [regex]::Replace($ui, $uiPattern, $uiReplacement)
          if ($ui2 -eq $ui) { throw "Template lowercase UI patch point not found" }
          $ui = $ui2
          [IO.File]::WriteAllText($uiFile, $ui, [Text.UTF8Encoding]::new($false))

          # Lowercase/uppercase are mutually exclusive and shown in Czech.
          $setupNeedle = "    m_ui->setupUi(this);"
          $setupReplace = @'
              m_ui->setupUi(this);
              m_ui->lowercase->setText(QStringLiteral("\u006d\u0061\u006c\u00e1 \u0070\u00ed\u0073\u006d\u0065\u006e\u0061"));
              connect(m_ui->uppercase, &QCheckBox::toggled, this, [this](bool checked) {
                  if (checked) m_ui->lowercase->setChecked(false);
              });
              connect(m_ui->lowercase, &QCheckBox::toggled, this, [this](bool checked) {
                  if (checked) m_ui->uppercase->setChecked(false);
              });
          '@
          if (!$td.Contains($setupNeedle)) { throw "Template setup patch point not found" }
          $td = $td.Replace($setupNeedle, $setupReplace)

          $capSaveNeedle = "        blockFont.setCapitalization(m_ui->uppercase->isChecked() ? QFont::AllUppercase : QFont::MixedCase);"
          $capSaveReplace = @'
                  if (m_ui->lowercase->isChecked()) {
            blockFont.setCapitalization(QFont::AllLowercase);
                  } else if (m_ui->uppercase->isChecked()) {
            blockFont.setCapitalization(QFont::AllUppercase);
                  } else {
            blockFont.setCapitalization(QFont::MixedCase);
                  }
          '@
          if (!$td.Contains($capSaveNeedle)) { throw "Template capitalization-save patch point not found" }
          $td = $td.Replace($capSaveNeedle, $capSaveReplace)

          $capLoadNeedle = "        m_ui->uppercase->setChecked(activatedBlockStyle.font().capitalization() == QFont::AllUppercase);"
          $capLoadReplace = @'
                  m_ui->uppercase->setChecked(activatedBlockStyle.font().capitalization() == QFont::AllUppercase);
                  m_ui->lowercase->setChecked(activatedBlockStyle.font().capitalization() == QFont::AllLowercase);
          '@
          if (!$td.Contains($capLoadNeedle)) { throw "Template capitalization-load patch point not found" }
          $td = $td.Replace($capLoadNeedle, $capLoadReplace)
          [IO.File]::WriteAllText($templateDialog, $td, [Text.UTF8Encoding]::new($false))

          # Persist lowercase in .kitss (backward compatible; old uppercase attribute stays supported).
          $scenarioTemplate = "$core\BusinessLayer\ScenarioDocument\ScenarioTemplate.cpp"
          $st = (Get-Content -Raw -Encoding UTF8 $scenarioTemplate).Replace("`r`n", "`n")
          $loadPattern = 'm_font\.setCapitalization\(_blockAttributes\.value\("uppercase"\)\.toString\(\) == "true"\s*\? QFont::AllUppercase : QFont::MixedCase\);'
          $loadReplacement = @'
              if (_blockAttributes.value("lowercase").toString() == "true") {
                  m_font.setCapitalization(QFont::AllLowercase);
              } else {
                  m_font.setCapitalization(_blockAttributes.value("uppercase").toString() == "true"
                                 ? QFont::AllUppercase : QFont::MixedCase);
              }
          '@
          $st2 = [regex]::Replace($st, $loadPattern, $loadReplacement)
          if ($st2 -eq $st) { throw "ScenarioTemplate lowercase-load patch point not found" }
          $st = $st2

          $savePattern = 'writer\.writeAttribute\("uppercase",\s*toString\(blockStyle\.font\(\)\.capitalization\(\)\s*== QFont::AllUppercase\)\);'
          $saveReplacement = @'
            writer.writeAttribute("uppercase", toString(blockStyle.font().capitalization()
                                                          == QFont::AllUppercase));
            writer.writeAttribute("lowercase", toString(blockStyle.font().capitalization()
                                                          == QFont::AllLowercase));
          '@
          $st2 = [regex]::Replace($st, $savePattern, $saveReplacement)
          if ($st2 -eq $st) { throw "ScenarioTemplate lowercase-save patch point not found" }
          $st = $st2
          [IO.File]::WriteAllText($scenarioTemplate, $st, [Text.UTF8Encoding]::new($false))

          $dictDir = "$env:GITHUB_WORKSPACE\czech-hunspell"
          New-Item -ItemType Directory -Force $dictDir | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/cs_CZ/cs_CZ.aff" -OutFile "$dictDir\cs_CZ.aff"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/cs_CZ/cs_CZ.dic" -OutFile "$dictDir\cs_CZ.dic"
          if ((Get-Item "$dictDir\cs_CZ.aff").Length -lt 100 -or (Get-Item "$dictDir\cs_CZ.dic").Length -lt 1000) {
              throw "Czech Hunspell dictionary download failed"
          }

      - name: Build release
        shell: cmd
        working-directory: upstream/src
        run: |
          qmake Scenarist.pro "CONFIG+=release"
          nmake

      - name: Package portable build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "$env:GITHUB_WORKSPACE\upstream\build\Release\bin\scenarist-desktop"
          if (!(Test-Path "$bin\Scenarist.exe")) { throw "Scenarist.exe was not built" }
          windeployqt --release --no-translations "$bin\Scenarist.exe"

          # Smoke-test the packaged executable before creating the ZIP.
          $proc = Start-Process -FilePath "$bin\Scenarist.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($proc.HasExited) { throw "Scenarist.exe exited during startup smoke test with code $($proc.ExitCode)" }
          Stop-Process -Id $proc.Id -Force
          New-Item -ItemType Directory -Force "$bin\Hunspell" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\czech-hunspell\cs_CZ.aff" "$bin\Hunspell\cs_CZ.aff" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\czech-hunspell\cs_CZ.dic" "$bin\Hunspell\cs_CZ.dic" -Force
          @"
          KIT Scenarist 0.7.2 rc15 - česká přenosná verze
          Český překlad aplikace je zabudovaný přímo v programu.
          Česká kontrola pravopisu je součástí balíčku.
          V Nastavení > Kontrola pravopisu zvolte Čeština.
          "@ | Set-Content -Encoding UTF8 "$bin\CZ_README.txt"
          Compress-Archive -Path "$bin\*" -DestinationPath "$env:GITHUB_WORKSPACE\KIT_Scenarist_CZ_VN_SAFE_FIX5.zip" -Force

      - name: Upload Czech build
