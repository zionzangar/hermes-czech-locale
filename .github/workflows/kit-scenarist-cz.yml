name: KIT Scenarist CZ portable build

on:
  push:
    paths:
      - ".github/workflows/kit-scenarist-cz.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build data
        uses: actions/checkout@v4

      - name: Install Qt 5.14.2 x86
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.14.2"
          host: "windows"
          target: "desktop"
          arch: "win32_msvc2017"
          modules: "qtmultimedia qtsvg qtwebengine qtwebchannel qtlocation qtdeclarative"
          cache: false

      - name: Enable MSVC x86
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x86

      - name: Clone KIT Scenarist
        shell: pwsh
        run: |
          git clone --recursive --depth 1 --branch develop https://github.com/dimkanovikov/KITScenarist.git KITScenarist
          if (-not (Test-Path "KITScenarist/src/bin/scenarist-core/Resources/Translations/Scenarist_en.ts")) {
            throw "KITScenaristCore submodule was not cloned correctly."
          }

      - name: Generate complete Czech TS
        shell: bash
        run: |
          python - <<'PY'
          import html, json, re, xml.etree.ElementTree as ET
          from pathlib import Path

          rootdir = Path("KITScenarist")
          en = rootdir / "src/bin/scenarist-core/Resources/Translations/Scenarist_en.ts"
          out = rootdir / "src/bin/scenarist-core/Resources/Translations/Scenarist_cs.ts"
          trans_file = Path("tmp/kit-scenarist-cz/Scenarist_cs_translations.json")

          trans = json.loads(trans_file.read_text(encoding="utf-8"))
          tree = ET.parse(en)
          root = tree.getroot()
          root.set("language", "cs_CZ")

          messages = root.findall(".//message")
          unique = []
          idx = {}
          for m in messages:
              src = m.findtext("source") or ""
              if src not in idx:
                  idx[src] = len(unique)
                  unique.append(src)

          if len(messages) != 1202 or len(unique) != 1016:
              raise SystemExit(f"Unexpected EN structure: messages={len(messages)} unique={len(unique)}")
          if len(trans) != 1016:
              raise SystemExit(f"Unexpected CZ translation count: {len(trans)}")

          placeholder_errors = []
          for m in messages:
              src = m.findtext("source") or ""
              value = html.unescape(trans[str(idx[src])])
              tr = m.find("translation")
              if tr is None:
                  tr = ET.SubElement(m, "translation")
              tr.attrib.pop("type", None)
              tr.text = value
              if sorted(re.findall(r"%\\d+", src)) != sorted(re.findall(r"%\\d+", value)):
                  placeholder_errors.append(src)

          if placeholder_errors:
              raise SystemExit("Placeholder mismatch: " + " | ".join(placeholder_errors[:20]))

          ET.indent(tree, space="    ")
          tree.write(out, encoding="utf-8", xml_declaration=True)
          print(f"Generated {out}: {len(messages)} messages, {len(unique)} unique strings")
          PY

      - name: Patch application to Czech
        shell: pwsh
        run: |
          $app = "KITScenarist/src/bin/scenarist-desktop/Application.cpp"
          $s = Get-Content -Raw -Encoding UTF8 $app

          $old = @'
              const int language =
                      DataStorageLayer::StorageFacade::settingsStorage()->value(
                          "application/language",
                          DataStorageLayer::SettingsStorage::ApplicationSettings)
                      .toInt();
          '@
          if (-not $s.Contains($old)) { throw "Language settings block not found." }
          $s = $s.Replace($old, "    const int language = 29;")

          $marker = @'
                  case 28: {
                      translationSuffix = "hr";
                      qtTranslationSuffix = "en";
                      qtBaseTranslationSuffix = "en";
                      currentLanguage = QLocale::Croatian;
                      break;
                  }

                  default: break;
          '@
          $replacement = @'
                  case 28: {
                      translationSuffix = "hr";
                      qtTranslationSuffix = "en";
                      qtBaseTranslationSuffix = "en";
                      currentLanguage = QLocale::Croatian;
                      break;
                  }

                  case 29: {
                      translationSuffix = "cs";
                      qtTranslationSuffix = "en";
                      qtBaseTranslationSuffix = "en";
                      currentLanguage = QLocale::Czech;
                      break;
                  }

                  default: break;
          '@
          if (-not $s.Contains($marker)) { throw "Language switch marker not found." }
          $s = $s.Replace($marker, $replacement)
          Set-Content -Path $app -Value $s -Encoding UTF8

          $qrc = "KITScenarist/src/bin/scenarist-core/Resources/Translations.qrc"
          $q = Get-Content -Raw -Encoding UTF8 $qrc
          if (-not $q.Contains("<file>Translations/Scenarist_en.qm</file>")) { throw "Translations.qrc marker not found." }
          $insert = "<file>Translations/Scenarist_en.qm</file>" + [Environment]::NewLine + "        <file>Translations/Scenarist_cs.qm</file>"
          $q = $q.Replace("<file>Translations/Scenarist_en.qm</file>", $insert)
          Set-Content -Path $qrc -Value $q -Encoding UTF8

      - name: Compile Czech QM
        shell: pwsh
        run: |
          $ts = "KITScenarist/src/bin/scenarist-core/Resources/Translations/Scenarist_cs.ts"
          $qm = "KITScenarist/src/bin/scenarist-core/Resources/Translations/Scenarist_cs.qm"
          & lrelease $ts -qm $qm
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $qm)) { throw "lrelease failed." }
          Get-Item $qm | Format-List FullName,Length

      - name: Build Release
        shell: pwsh
        run: |
          Set-Location KITScenarist/src
          qmake Scenarist.pro "CONFIG+=release"
          if ($LASTEXITCODE -ne 0) { throw "qmake failed." }
          nmake
          if ($LASTEXITCODE -ne 0) { throw "nmake failed." }

      - name: Create portable package
        shell: pwsh
        run: |
          $exe = "KITScenarist/build/Release/bin/scenarist-desktop/Scenarist.exe"
          if (-not (Test-Path $exe)) { throw "Scenarist.exe was not produced." }

          $portable = "KITScenarist-CZ-Portable"
          New-Item -ItemType Directory -Force -Path $portable | Out-Null
          Copy-Item $exe "$portable/Scenarist.exe"

          & windeployqt --release --compiler-runtime --no-translations "$portable/Scenarist.exe"
          if ($LASTEXITCODE -ne 0) { throw "windeployqt failed." }

          @'
          KIT Scenarist - česká přenosná verze
          =====================================

          Instalace není potřeba.

          1. Rozbalte celý obsah ZIPu do libovolné složky.
          2. Spusťte Scenarist.exe.
          3. Vaše existující projekty .kitsp můžete normálně otevřít.

          Tato verze má překlad aplikace napevno nastavený na češtinu.
          Původní instalaci KIT Scenaristu není nutné odinstalovat ani měnit.
          '@ | Set-Content -Encoding UTF8 "$portable/ČTI_MĚ.txt"

          Get-ChildItem $portable -Recurse | Select-Object FullName,Length

      - name: Smoke test portable EXE
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "$PWD/KITScenarist-CZ-Portable/Scenarist.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($p.HasExited) {
            throw "Scenarist exited during smoke test with code $($p.ExitCode)."
          }
          Stop-Process -Id $p.Id -Force
          Write-Host "Smoke test passed: application stayed running."

      - name: Create ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path "KITScenarist-CZ-Portable/*" -DestinationPath "KITScenarist-CZ-Portable.zip" -CompressionLevel Optimal
          Get-FileHash "KITScenarist-CZ-Portable.zip" -Algorithm SHA256

      - name: Upload portable ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KITScenarist-CZ-Portable
          path: KITScenarist-CZ-Portable.zip
          if-no-files-found: error
          compression-level: 0
