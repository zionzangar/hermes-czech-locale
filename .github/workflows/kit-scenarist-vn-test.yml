name: KIT Scenarist CZ Visual Novel Test Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kit-scenarist-vn-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build input branch
        uses: actions/checkout@v4
        with:
          ref: kit-scenarist-cz-build
          path: inputs

      - name: Checkout KIT Scenarist
        uses: actions/checkout@v4
        with:
          repository: dimkanovikov/KITScenarist
          ref: develop
          submodules: recursive
          path: upstream

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 5.14.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.14.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2017_64"
          modules: "qtwebengine"
          cache: true

      - name: Prepare Czech translation and spellchecker
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\inputs\kit-build\jsonparts\part*.txt" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 translation parts, got $($parts.Count)" }
          $json = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\translations.json", $json, [Text.UTF8Encoding]::new($false))

          $core = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-core"
          $trans = "$core\Resources\Translations"
          $py = @'
          import json, html, re, pathlib, xml.etree.ElementTree as ET, os
          workspace = pathlib.Path(os.environ["GITHUB_WORKSPACE"])
          trans_dir = workspace / "upstream" / "src" / "bin" / "scenarist-core" / "Resources" / "Translations"
          en_path = trans_dir / "Scenarist_en.ts"
          cs_path = trans_dir / "Scenarist_cs.ts"
          translations = json.loads((workspace / "translations.json").read_text(encoding="utf-8"))
          tree = ET.parse(en_path)
          root = tree.getroot()
          root.set("language", "cs_CZ")
          seen = {}
          messages = 0
          for msg in root.findall(".//message"):
              src_el = msg.find("source")
              if src_el is None:
                  continue
              src = src_el.text or ""
              if src not in seen:
                  seen[src] = len(seen)
              idx = seen[src]
              value = html.unescape(translations[str(idx)])
              if sorted(re.findall(r"%\d+", src)) != sorted(re.findall(r"%\d+", value)):
                  raise RuntimeError(f"Placeholder mismatch at {idx}: {src!r}")
              tr = msg.find("translation")
              if tr is None:
                  tr = ET.SubElement(msg, "translation")
              tr.attrib.pop("type", None)
              tr.text = value
              messages += 1
          if messages != 1202 or len(seen) != 1016 or len(translations) != 1016:
              raise RuntimeError(f"Unexpected translation structure: messages={messages}, unique={len(seen)}, translations={len(translations)}")
          tmp = cs_path.with_suffix(".tmp")
          tree.write(tmp, encoding="utf-8", xml_declaration=True)
          text = tmp.read_text(encoding="utf-8")
          first, rest = text.split("\n", 1)
          cs_path.write_text(first + "\n<!DOCTYPE TS>\n" + rest, encoding="utf-8")
          tmp.unlink()
          '@
          [IO.File]::WriteAllText("$env:GITHUB_WORKSPACE\make_czech_ts.py", $py, [Text.UTF8Encoding]::new($false))
          python "$env:GITHUB_WORKSPACE\make_czech_ts.py"

          lrelease "$trans\Scenarist_cs.ts" -qm "$trans\Scenarist_cs.qm"
          if (!(Test-Path "$trans\Scenarist_cs.qm")) { throw "Scenarist_cs.qm was not created" }

          $qmake = (Get-Command qmake).Source
          $qtRoot = Split-Path (Split-Path $qmake -Parent) -Parent
          $qtTranslations = Join-Path $qtRoot "translations"
          Copy-Item (Join-Path $qtTranslations "qt_cs.qm") "$trans\qt_cs.qm" -Force
          Copy-Item (Join-Path $qtTranslations "qtbase_cs.qm") "$trans\qtbase_cs.qm" -Force

          $qrcPath = "$core\Resources\Translations.qrc"
          $qrc = Get-Content -Raw -Encoding UTF8 $qrcPath
          $insert = @"
                  <file>Translations/Scenarist_cs.qm</file>
                  <file>Translations/qt_cs.qm</file>
                  <file>Translations/qtbase_cs.qm</file>
          "@
          $qrc = $qrc -replace '</qresource>', ($insert + [Environment]::NewLine + '    </qresource>')
          [IO.File]::WriteAllText($qrcPath, $qrc, [Text.UTF8Encoding]::new($false))

          $appPath = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\Application.cpp"
          $app = Get-Content -Raw -Encoding UTF8 $appPath
          $forceCzech = @"

              translationSuffix = "cs";
              qtTranslationSuffix = "cs";
              qtBaseTranslationSuffix = "cs";
              currentLanguage = QLocale::Czech;

          "@
          $needle = '    QLocale::setDefault(QLocale(currentLanguage));'
          if (!$app.Contains($needle)) { throw "Could not find locale patch point" }
          $app = $app.Replace($needle, $forceCzech + $needle)
          $app = $app.Replace('setApplicationVersion("0.7.2 rc 15");', 'setApplicationVersion("0.7.2 rc 15 CZ");')
          [IO.File]::WriteAllText($appPath, $app, [Text.UTF8Encoding]::new($false))

          $desktopPro = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop.pro"
          $pro = Get-Content -Raw -Encoding UTF8 $desktopPro
          if (!$pro.Contains('DEFINES += HUNSPELL_STATIC')) {
              $pro = $pro.Replace('CONFIG += c++11 warn_on', 'CONFIG += c++11 warn_on' + [Environment]::NewLine + 'DEFINES += HUNSPELL_STATIC')
          }
          [IO.File]::WriteAllText($desktopPro, $pro, [Text.UTF8Encoding]::new($false))

          $spellH = "$core\3rd_party\Widgets\SpellCheckTextEdit\SpellChecker.h"
          $h = Get-Content -Raw -Encoding UTF8 $spellH
          $needleH = "        Danish" + [Environment]::NewLine + "    };"
          $replaceH = "        Danish," + [Environment]::NewLine + "        Czech" + [Environment]::NewLine + "    };"
          if (!$h.Contains($needleH)) { throw "SpellChecker enum patch point not found" }
          $h = $h.Replace($needleH, $replaceH)
          [IO.File]::WriteAllText($spellH, $h, [Text.UTF8Encoding]::new($false))

          $spellCpp = "$core\3rd_party\Widgets\SpellCheckTextEdit\SpellChecker.cpp"
          $c = Get-Content -Raw -Encoding UTF8 $spellCpp
          $danish = @'
                  case Danish:
                      code = "da_DA";
                      break;
          '@
          $danishCz = @'
                  case Danish:
                      code = "da_DA";
                      break;
                  case Czech:
                      code = "cs_CZ";
                      break;
          '@
          if (!$c.Contains($danish)) { throw "Danish mapping patch point not found" }
          $c = $c.Replace($danish, $danishCz)

          $oldPath = @'
              QString appDataFolderPath = QStandardPaths::writableLocation(QStandardPaths::DataLocation);
              QString hunspellDictionariesFolderPath = appDataFolderPath + QDir::separator() + "Hunspell";
              QString dictionaryFilePath = hunspellDictionariesFolderPath + QDir::separator() + fileName;
              return dictionaryFilePath;
          '@
          $newPath = @'
              QString portableFolderPath = QApplication::applicationDirPath()
                      + QDir::separator() + "Hunspell";
              QString portableDictionaryFilePath = portableFolderPath
                      + QDir::separator() + fileName;
              if (QFileInfo::exists(portableDictionaryFilePath)) {
                  return portableDictionaryFilePath;
              }

              QString appDataFolderPath = QStandardPaths::writableLocation(QStandardPaths::DataLocation);
              QString hunspellDictionariesFolderPath = appDataFolderPath + QDir::separator() + "Hunspell";
              QString dictionaryFilePath = hunspellDictionariesFolderPath + QDir::separator() + fileName;
              return dictionaryFilePath;
          '@
          if (!$c.Contains($oldPath)) { throw "Hunspell path patch point not found" }
          $c = $c.Replace($oldPath, $newPath)
          [IO.File]::WriteAllText($spellCpp, $c, [Text.UTF8Encoding]::new($false))

          $settings = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\UserInterfaceLayer\Settings\SettingsView.cpp"
          $s = Get-Content -Raw -Encoding UTF8 $settings
          $cat = '    m_ui->spellCheckingLanguage->addItem(tr("Catalan"), SpellChecker::Catalan);'
          if (!$s.Contains($cat)) { throw "Settings spell-language patch point not found" }
          $s = $s.Replace($cat, $cat + [Environment]::NewLine + '    m_ui->spellCheckingLanguage->addItem(QStringLiteral("\\u010Ce\\u0161tina"), SpellChecker::Czech);')
          [IO.File]::WriteAllText($settings, $s, [Text.UTF8Encoding]::new($false))

          # This portable build must not try to download dictionaries from the old KIT server.
          # Point SettingsManager to the same local Hunspell folder beside Scenarist.exe.
          $settingsMgr = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\ManagementLayer\Settings\SettingsManager.cpp"
          $sm = Get-Content -Raw -Encoding UTF8 $settingsMgr
          $oldDictRoot = '    const QString appDataFolderPath = QStandardPaths::writableLocation(QStandardPaths::DataLocation);' + [Environment]::NewLine + '    const QString hunspellDictionariesFolderPath =' + [Environment]::NewLine + '        appDataFolderPath + QDir::separator() + "Hunspell" + QDir::separator();'
          $newDictRoot = '    const QString hunspellDictionariesFolderPath =' + [Environment]::NewLine + '        QApplication::applicationDirPath() + QDir::separator() + "Hunspell" + QDir::separator();'
          if (!$sm.Contains($oldDictRoot)) { throw "SettingsManager dictionary path patch point not found" }
          $sm = $sm.Replace($oldDictRoot, $newDictRoot)
          [IO.File]::WriteAllText($settingsMgr, $sm, [Text.UTF8Encoding]::new($false))

          # --- Visual Novel edition: rename screenplay blocks and expose chapter/scene-description ---
          $templateCpp = "$core\BusinessLayer\ScenarioDocument\ScenarioTemplate.cpp"
          $tc = Get-Content -Raw -Encoding UTF8 $templateCpp

          $renames = @{
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Scene Heading")' = 'QStringLiteral("Název scény")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Scene Characters")' = 'QStringLiteral("Postavy ve scéně")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Action")' = 'QStringLiteral("Dění")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Character")' = 'QStringLiteral("Postava")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Parenthetical")' = 'QStringLiteral("Tech. popis")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Dialog")' = 'QStringLiteral("Dialog")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Transition")' = 'QStringLiteral("SFX / Zvuk")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Shot")' = 'QStringLiteral("Obraz")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Title")' = 'QStringLiteral("Skok na scénu")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Noprintable Text")' = 'QStringLiteral("Interní logika")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Folder")' = 'QStringLiteral("Kapitola")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Scene Description")' = 'QStringLiteral("Popis scény")'
              'QApplication::translate("BusinessLogic::ScenarioBlockStyle", "Lyrics")' = 'QStringLiteral("Herní volba")'
          }
          foreach ($k in $renames.Keys) {
              if (!$tc.Contains($k)) { throw "VN rename patch point not found: $k" }
              $tc = $tc.Replace($k, $renames[$k])
          }

          # Make the special Title header read as a printed scene jump.
          $tc = $tc.Replace('QObject::tr("Title:", "ScenarioBlockStyle")', 'QStringLiteral("→ SKOK NA SCÉNU:")')

          # Add bundled Visual Novel template to the default template library.
          $insertTemplateUpdate = '    updateDefaultTemplate("arabic.");'
          if (!$tc.Contains($insertTemplateUpdate)) { throw "Template registration patch point not found" }
          $tc = $tc.Replace($insertTemplateUpdate, $insertTemplateUpdate + [Environment]::NewLine + '    updateDefaultTemplate("visual_novel_cz.");')
          [IO.File]::WriteAllText($templateCpp, $tc, [Text.UTF8Encoding]::new($false))

          # Add Chapter and Scene Description to the quick block panel.
          $fast = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\UserInterfaceLayer\Scenario\ScenarioTextEdit\ScenarioFastFormatWidget.cpp"
          $fc = Get-Content -Raw -Encoding UTF8 $fast
          $fastNeedle = '          << ScenarioBlockStyle::Lyrics;'
          $fastReplace = '          << ScenarioBlockStyle::Lyrics' + [Environment]::NewLine + '          << ScenarioBlockStyle::FolderHeader' + [Environment]::NewLine + '          << ScenarioBlockStyle::SceneDescription;'
          if (!$fc.Contains($fastNeedle)) { throw "Fast-format list patch point not found" }
          $fc = $fc.Replace($fastNeedle, $fastReplace)
          [IO.File]::WriteAllText($fast, $fc, [Text.UTF8Encoding]::new($false))

          # Create the Visual Novel template.
          $vnTemplate = @'
<?xml version="1.0" encoding="UTF-8"?>
<style default="false" name="Visual Novel CZ TEST" description="Pracovní šablona pro vizuální romány." page_format="A4" page_margins="22,18,18,18" numbering_alignment="top,right">
  <block id="scene_heading" active="true" font_family="Segoe UI" font_size="13" bold="true" italic="false" underline="false" uppercase="false" alignment="left" top_space="2" bottom_space="1" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="scene_characters" active="true" font_family="Segoe UI" font_size="10" bold="false" italic="true" underline="false" uppercase="false" alignment="left" top_space="0" bottom_space="1" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="action" active="true" font_family="Segoe UI" font_size="11" bold="false" italic="false" underline="false" uppercase="false" alignment="left" top_space="1" bottom_space="0" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="character" active="true" font_family="Segoe UI" font_size="11" bold="true" italic="false" underline="false" uppercase="true" alignment="left" top_space="1" bottom_space="0" left_margin="12" left_margin_splitted="6" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="parenthetical" active="true" font_family="Segoe UI" font_size="10" bold="false" italic="true" underline="false" uppercase="false" alignment="left" top_space="0" bottom_space="0" left_margin="4" left_margin_splitted="2" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="[TECH] " postfix=""/>
  <block id="dialog" active="true" font_family="Segoe UI" font_size="11" bold="false" italic="false" underline="false" uppercase="false" alignment="left" top_space="0" bottom_space="0" left_margin="12" left_margin_splitted="6" top_margin="0" right_margin="12" right_margin_splitted="6" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="transition" active="true" font_family="Segoe UI" font_size="10" bold="true" italic="false" underline="false" uppercase="false" alignment="left" top_space="1" bottom_space="0" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="[SFX] " postfix=""/>
  <block id="note" active="true" font_family="Segoe UI" font_size="10" bold="true" italic="false" underline="false" uppercase="false" alignment="left" top_space="1" bottom_space="0" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="[OBRAZ] " postfix=""/>
  <block id="title_header" active="true" font_family="Segoe UI" font_size="10" bold="true" italic="false" underline="false" uppercase="true" alignment="left" top_space="1" bottom_space="0" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="title" active="true" font_family="Segoe UI" font_size="10" bold="true" italic="false" underline="false" uppercase="false" alignment="left" top_space="0" bottom_space="1" left_margin="8" left_margin_splitted="4" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="noprintable_text" active="true" font_family="Consolas" font_size="9" bold="false" italic="false" underline="false" uppercase="false" alignment="left" top_space="0" bottom_space="0" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="[LOGIKA] " postfix=""/>
  <block id="folder_header" active="true" font_family="Segoe UI" font_size="15" bold="true" italic="false" underline="false" uppercase="true" alignment="left" top_space="3" bottom_space="1" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="KAPITOLA: " postfix=""/>
  <block id="folder_footer" active="true" font_family="Segoe UI" font_size="10" bold="false" italic="false" underline="false" uppercase="false" alignment="left" top_space="0" bottom_space="0" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="scene_description" active="true" font_family="Segoe UI" font_size="10" bold="false" italic="true" underline="false" uppercase="false" alignment="left" top_space="0" bottom_space="1" left_margin="0" left_margin_splitted="0" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="" postfix=""/>
  <block id="lyrics" active="true" font_family="Segoe UI" font_size="10" bold="true" italic="false" underline="false" uppercase="false" alignment="left" top_space="1" bottom_space="1" left_margin="4" left_margin_splitted="2" top_margin="0" right_margin="0" right_margin_splitted="0" bottom_margin="0" line_spacing="single" line_spacing_value="0" prefix="[VOLBA] " postfix=""/>
</style>
'@
          $vnTemplatePath = "$core\Resources\Templates\visual_novel_cz.kitss"
          [IO.File]::WriteAllText($vnTemplatePath, $vnTemplate, [Text.UTF8Encoding]::new($false))

          # Register VN template as a Qt resource.
          $resourcesQrc = "$core\Resources\Resources.qrc"
          $rq = Get-Content -Raw -Encoding UTF8 $resourcesQrc
          $rqNeedle = '<file>Templates/final_draft_a4.kitss</file>'
          if (!$rq.Contains($rqNeedle)) { throw "Resources.qrc template marker not found" }
          $rq = $rq.Replace($rqNeedle, $rqNeedle + [Environment]::NewLine + '        <file>Templates/visual_novel_cz.kitss</file>')
          [IO.File]::WriteAllText($resourcesQrc, $rq, [Text.UTF8Encoding]::new($false))

          $dictDir = "$env:GITHUB_WORKSPACE\czech-hunspell"
          New-Item -ItemType Directory -Force $dictDir | Out-Null
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/cs_CZ/cs_CZ.aff" -OutFile "$dictDir\cs_CZ.aff"
          Invoke-WebRequest -Uri "https://raw.githubusercontent.com/LibreOffice/dictionaries/master/cs_CZ/cs_CZ.dic" -OutFile "$dictDir\cs_CZ.dic"
          if ((Get-Item "$dictDir\cs_CZ.aff").Length -lt 100 -or (Get-Item "$dictDir\cs_CZ.dic").Length -lt 1000) {
              throw "Czech Hunspell dictionary download failed"
          }

      - name: Build release
        shell: cmd
        working-directory: upstream/src
        run: |
          qmake Scenarist.pro "CONFIG+=release"
          nmake

      - name: Package portable build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "$env:GITHUB_WORKSPACE\upstream\build\Release\bin\scenarist-desktop"
          if (!(Test-Path "$bin\Scenarist.exe")) { throw "Scenarist.exe was not built" }
          windeployqt --release --no-translations "$bin\Scenarist.exe"
          New-Item -ItemType Directory -Force "$bin\Hunspell" | Out-Null
          Copy-Item "$env:GITHUB_WORKSPACE\czech-hunspell\cs_CZ.aff" "$bin\Hunspell\cs_CZ.aff" -Force
          Copy-Item "$env:GITHUB_WORKSPACE\czech-hunspell\cs_CZ.dic" "$bin\Hunspell\cs_CZ.dic" -Force
          @"
          KIT Scenarist 0.7.2 rc15 - česká přenosná verze
          Český překlad aplikace je zabudovaný přímo v programu.
          Česká kontrola pravopisu je součástí balíčku.`r`n          Přidána testovací VN edice bloků a šablona Visual Novel CZ TEST.
          V Nastavení > Kontrola pravopisu zvolte Čeština.
          "@ | Set-Content -Encoding UTF8 "$bin\CZ_README.txt"
          Compress-Archive -Path "$bin\*" -DestinationPath "$env:GITHUB_WORKSPACE\KIT_Scenarist_CZ_VisualNovel_TEST.zip" -Force

      - name: Upload Czech build
        uses: actions/upload-artifact@v4
        with:
          name: KIT_Scenarist_CZ_VisualNovel_TEST
          path: KIT_Scenarist_CZ_VisualNovel_TEST.zip
          if-no-files-found: error
          retention-days: 7
