name: Temporary KIT Scenarist Czech Build

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/kit-scenarist-cz-temp.yml"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout build input branch
        uses: actions/checkout@v4
        with:
          ref: kit-scenarist-cz-build
          path: inputs

      - name: Checkout KIT Scenarist
        uses: actions/checkout@v4
        with:
          repository: dimkanovikov/KITScenarist
          ref: develop
          submodules: recursive
          path: upstream

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 5.14.2
        uses: jurplel/install-qt-action@v4
        with:
          version: "5.14.2"
          host: "windows"
          target: "desktop"
          arch: "win64_msvc2017_64"
          modules: "qtwebengine"
          cache: true

      - name: Prepare Czech translation and source patches
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $parts = Get-ChildItem "$env:GITHUB_WORKSPACE\inputs\kit-build\jsonparts\part*.txt" | Sort-Object Name
          if ($parts.Count -ne 7) { throw "Expected 7 translation parts, got $($parts.Count)" }
          $json = ($parts | ForEach-Object { Get-Content -Raw -Encoding UTF8 $_.FullName }) -join ""
          $jsonPath = "$env:GITHUB_WORKSPACE\translations.json"
          [IO.File]::WriteAllText($jsonPath, $json, [Text.UTF8Encoding]::new($false))

          $core = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-core"
          $trans = "$core\Resources\Translations"
          $py = @'
          import json, html, re, pathlib, xml.etree.ElementTree as ET

          workspace = pathlib.Path(__import__("os").environ["GITHUB_WORKSPACE"])
          trans_dir = workspace / "upstream" / "src" / "bin" / "scenarist-core" / "Resources" / "Translations"
          en_path = trans_dir / "Scenarist_en.ts"
          cs_path = trans_dir / "Scenarist_cs.ts"
          translations = json.loads((workspace / "translations.json").read_text(encoding="utf-8"))

          tree = ET.parse(en_path)
          root = tree.getroot()
          root.set("language", "cs_CZ")
          seen = {}
          messages = 0
          for msg in root.findall(".//message"):
              src_el = msg.find("source")
              if src_el is None:
                  continue
              src = src_el.text or ""
              if src not in seen:
                  seen[src] = len(seen)
              idx = seen[src]
              key = str(idx)
              if key not in translations:
                  raise RuntimeError(f"Missing Czech translation index {idx}: {src!r}")
              value = html.unescape(translations[key])
              src_ph = sorted(re.findall(r"%\d+", src))
              tr_ph = sorted(re.findall(r"%\d+", value))
              if src_ph != tr_ph:
                  raise RuntimeError(f"Placeholder mismatch at {idx}: {src_ph} != {tr_ph}")
              tr = msg.find("translation")
              if tr is None:
                  tr = ET.SubElement(msg, "translation")
              tr.attrib.pop("type", None)
              tr.text = value
              messages += 1

          if messages != 1202:
              raise RuntimeError(f"Expected 1202 messages, got {messages}")
          if len(seen) != 1016:
              raise RuntimeError(f"Expected 1016 unique sources, got {len(seen)}")
          if len(translations) != 1016:
              raise RuntimeError(f"Expected 1016 Czech translations, got {len(translations)}")

          tmp = cs_path.with_suffix(".tmp")
          tree.write(tmp, encoding="utf-8", xml_declaration=True)
          text = tmp.read_text(encoding="utf-8")
          first, rest = text.split("\n", 1)
          cs_path.write_text(first + "\n<!DOCTYPE TS>\n" + rest, encoding="utf-8")
          tmp.unlink()
          print(f"Czech TS ready: {messages} messages, {len(seen)} unique strings")
          '@
          $pyPath = "$env:GITHUB_WORKSPACE\make_czech_ts.py"
          [IO.File]::WriteAllText($pyPath, $py, [Text.UTF8Encoding]::new($false))
          python $pyPath

          lrelease "$trans\Scenarist_cs.ts" -qm "$trans\Scenarist_cs.qm"
          if (!(Test-Path "$trans\Scenarist_cs.qm")) { throw "Scenarist_cs.qm was not created" }

          $qmake = (Get-Command qmake).Source
          $qtRoot = Split-Path (Split-Path $qmake -Parent) -Parent
          $qtTranslations = Join-Path $qtRoot "translations"
          Copy-Item (Join-Path $qtTranslations "qt_cs.qm") "$trans\qt_cs.qm" -Force
          Copy-Item (Join-Path $qtTranslations "qtbase_cs.qm") "$trans\qtbase_cs.qm" -Force

          $qrcPath = "$core\Resources\Translations.qrc"
          $qrc = Get-Content -Raw -Encoding UTF8 $qrcPath
          $insert = @"
                  <file>Translations/Scenarist_cs.qm</file>
                  <file>Translations/qt_cs.qm</file>
                  <file>Translations/qtbase_cs.qm</file>
          "@
          $qrc = $qrc -replace '</qresource>', ($insert + [Environment]::NewLine + '    </qresource>')
          [IO.File]::WriteAllText($qrcPath, $qrc, [Text.UTF8Encoding]::new($false))

          $appPath = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop\Application.cpp"
          $app = Get-Content -Raw -Encoding UTF8 $appPath
          $forceCzech = @"

              // Czech localization build: always use Czech UI.
              translationSuffix = "cs";
              qtTranslationSuffix = "cs";
              qtBaseTranslationSuffix = "cs";
              currentLanguage = QLocale::Czech;

          "@
          $needle = '    QLocale::setDefault(QLocale(currentLanguage));'
          if (!$app.Contains($needle)) { throw "Could not find locale patch point" }
          $app = $app.Replace($needle, $forceCzech + $needle)
          $app = $app.Replace('setApplicationVersion("0.7.2 rc 15");', 'setApplicationVersion("0.7.2 rc 15 CZ");')
          [IO.File]::WriteAllText($appPath, $app, [Text.UTF8Encoding]::new($false))

          # The bundled Hunspell library is built statically. The original project
          # does not propagate HUNSPELL_STATIC to the desktop target with newer MSVC,
          # which makes hunspell.hxx declare imported DLL symbols at final link.
          $desktopPro = "$env:GITHUB_WORKSPACE\upstream\src\bin\scenarist-desktop.pro"
          $pro = Get-Content -Raw -Encoding UTF8 $desktopPro
          if (!$pro.Contains('DEFINES += HUNSPELL_STATIC')) {
              $pro = $pro.Replace('CONFIG += c++11 warn_on', "CONFIG += c++11 warn_on`r`nDEFINES += HUNSPELL_STATIC")
          }
          [IO.File]::WriteAllText($desktopPro, $pro, [Text.UTF8Encoding]::new($false))

      - name: Build release
        shell: cmd
        working-directory: upstream/src
        run: |
          qmake Scenarist.pro "CONFIG+=release"
          nmake

      - name: Package portable build
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $bin = "$env:GITHUB_WORKSPACE\upstream\build\Release\bin\scenarist-desktop"
          if (!(Test-Path "$bin\Scenarist.exe")) { throw "Scenarist.exe was not built" }

          windeployqt --release --no-translations "$bin\Scenarist.exe"

          @"
          KIT Scenarist 0.7.2 rc15 - česká přenosná verze
          Překlad aplikace je zabudovaný přímo v programu.
          Není nutná instalace Qt ani Visual Studia.
          "@ | Set-Content -Encoding UTF8 "$bin\CZ_README.txt"

          Compress-Archive -Path "$bin\*" -DestinationPath "$env:GITHUB_WORKSPACE\KIT_Scenarist_CZ_Windows_x64.zip" -Force

      - name: Upload Czech build
        uses: actions/upload-artifact@v4
        with:
          name: KIT_Scenarist_CZ_Windows_x64
          path: KIT_Scenarist_CZ_Windows_x64.zip
          if-no-files-found: error
          retention-days: 7
